name: Website
on:
  push:
    branches: [codex/root-site]
  pull_request:
    branches: [codex/root-site]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - run: npm run build
      - run: npm run verify:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
